# VoiceShield — Kubernetes Secret (template)
#
# IMPORTANT: Replace the placeholder base64 values with real keys.
# Generate base64: echo -n "sk-your-real-key" | base64
#
# Never commit a Secret with real key material — use Sealed Secrets,
# external-secrets-operator, or a secrets manager in production.

apiVersion: v1
kind: Secret
metadata:
  name: voiceshield-secrets
  namespace: voiceshield
  labels:
    app.kubernetes.io/name: voiceshield
type: Opaque
data:
  # base64("your-aiml-api-key") — replace with real value
  aiml-api-key: eW91ci1haW1sLWFwaS1rZXk=
  # base64("your-speechmatics-api-key") — replace with real value
  speechmatics-api-key: eW91ci1zcGVlY2htYXRpY3MtYXBpLWtleQ==
