---
# VoiceShield + n8n — Docker Compose
#
# Runs VoiceShield alongside n8n for workflow automation:
#   - n8n can trigger test runs, collect results, and post to Slack/Teams.
#   - VoiceShield BFF proxy is accessible at http://voiceshield:8080
#     from inside the n8n container.
#
# Usage:
#   1. Copy .env.example to .env and fill in API keys.
#   2. docker compose up -d
#   3. VoiceShield: http://localhost:8080
#      n8n:          http://localhost:5678
#
# Security:
#   - API keys are read from the .env file (gitignored).
#   - n8n is not exposed publicly by default; bind to 127.0.0.1.
#   - Change N8N_BASIC_AUTH_PASSWORD before deploying to any shared environment.

services:
  voiceshield:
    build:
      context: .
      dockerfile: Dockerfile
    image: voiceshield:latest
    container_name: voiceshield
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AIML_API_KEY: ${AIML_API_KEY:-}
      AIML_API_KEYS: ${AIML_API_KEYS:-}
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:-}
      SPEECHMATICS_API_KEYS: ${SPEECHMATICS_API_KEYS:-}
      KEY_ROTATION_INTERVAL: ${KEY_ROTATION_INTERVAL:-6h}
      KEY_ROTATION_FAILURE_THRESHOLD: ${KEY_ROTATION_FAILURE_THRESHOLD:-3}
      RUNTIME_KEY_TTL: ${RUNTIME_KEY_TTL:-6h}
      # Allow n8n to call /api/* without CORS rejection
      ALLOWED_ORIGINS: "http://n8n:5678,http://localhost:5678"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - voiceshield-net

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # Bind to localhost only — do not expose publicly without TLS + auth
      - "127.0.0.1:5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-changeme}
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://localhost:5678/"
      # VoiceShield base URL — accessible inside Docker network
      VOICESHIELD_URL: "http://voiceshield:8080"
      GENERIC_TIMEZONE: "UTC"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      voiceshield:
        condition: service_healthy
    networks:
      - voiceshield-net

networks:
  voiceshield-net:
    driver: bridge

volumes:
  n8n-data:
    driver: local
